[project]
name = "nextrouter"
version = "1.0.0"
description = ""
authors = [
  { name = "Marco André Mendes", email = "marcoandre@gmail.com" },
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
  { name = "Paulo Artur Pereira", email = "pauloartur23@gmail.com" },
]
dependencies = [
  "dj-database-url>=3.1.2",
  "django-cloudinary-storage>=0.3.0",
  "django-cors-headers>=4.9.0",
  "django-extensions>=4.1",
  "django-filter>=26.1",
  "django>=6.0.7",
  "djangorestframework>=3.17.1",
  "drf-spectacular>=0.30.0",
  "gunicorn>=26.0.0",
  # 'mysqlclient>=2.2.4',
  "python-dotenv>=1.2.2",
  "python-magic-bin>=0.4.14; sys_platform == \"win32\"",
  "python-magic>=0.4.27; sys_platform == \"linux\"",
  "uvicorn>=0.51.0",
  "whitenoise[brotli]>=6.12.0",
  "djangorestframework-simplejwt>=5.5.1",
  "pyparsing>=3.3.2",
  "pillow>=12.3.0",
  "django-crispy-forms>=2.7",
  "channels>=4.3.2",
  "daphne>=4.2.3",
  "requests>=2.34.2",
  "channels-redis>=4.3.0",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "django-stubs>=6.1.0",
]

[tool.pdm.scripts]
pre_dev = { composite = [
  "python ./scripts/setup_env.py",
  "python ./scripts/set_my_ip.py",
] }
dev = "python manage.py runserver"
createsuperuser = "python manage.py createsuperuser"
premigrate = "python manage.py makemigrations"
migrate = "python manage.py migrate"
make_graph = "python manage.py graph_models --pydot --arrow-shape normal --color-code-deletions --hide-edge-labels --disable-sort-fields -S -g -o core.png authenticator uploader router"
shell = "python manage.py shell"
shellp = "python manage.py shell_plus"
test = "python manage.py test"
loaddata = "python manage.py loaddata core.json"
cria_api = "python ./scripts/cria_api.py {args}"
check = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"

[tool.pdm]
distribution = false

[tool.ruff]
line-length = 120
extend-exclude = ['migrations', '__init__.py', 'manage.py']

[tool.ruff.lint]
preview = true
select = [
    "F",     
    "E", "W",
    "I",  
    "UP", 
    "B",  
    "C4", 
    "DJ", 
    "SIM",
    "RUF",    
]
ignore = [
    "no-self-use"
]

[tool.ruff.format]
preview = true
quote-style = 'single'
