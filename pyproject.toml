[project]
name = "nextrouter"
version = "1.0.0"
description = ""
requires-python = ">=3.13"
authors = [
  { name = "Marco André Mendes", email = "marcoandre@gmail.com" },
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
  { name = "Paulo Artur Pereira", email = "pauloartur23@gmail.com" },
]
dependencies = [
  "dj-database-url>=3.1.2",
  "django-cloudinary-storage>=0.3.0",
  "django-cors-headers>=4.9.0",
  "django-extensions>=4.1",
  "django-filter>=26.2",
  "django>=6.0.7",
  "djangorestframework>=3.17.1",
  "drf-spectacular>=0.30.0",
  "gunicorn>=26.0.0",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.2.2",
  "python-magic-bin>=0.4.14; sys_platform == \"win32\"",
  "python-magic>=0.4.27; sys_platform == \"linux\"",
  "uvicorn>=0.51.0",
  "whitenoise[brotli]>=6.12.0",
  "djangorestframework-simplejwt>=5.5.1",
  "pyparsing>=3.3.2",
  "pillow>=12.3.0",
  "django-crispy-forms>=2.7",
  "channels>=4.3.2",
  "daphne>=4.2.3",
  "requests>=2.34.2",
  "channels-redis>=4.3.0",
  "user-agents>=2.2.0",
  "django-ipware>=8.0.0",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "django-stubs>=6.1.0",
]

[tool.pdm.scripts]
dev = "python manage.py runserver"
runserver = "python manage.py runserver"
asgi = { cmd = "daphne -b 127.0.0.1 -p 8000 app.asgi:application", env = { DJANGO_SETTINGS_MODULE = "app.settings.dev" } }
worker = "python manage.py process_route_jobs"
createsuperuser = "python manage.py createsuperuser"
migrate = "python manage.py migrate"
shell = "python manage.py shell"
shellp = "python manage.py shell_plus"
test = "python manage.py test --noinput --settings=app.settings.dev"
check = { composite = ["python manage.py check", "python manage.py makemigrations --check --dry-run"] }
check-deploy = "python manage.py check --deploy --settings=app.settings.prod"
lint = { composite = ["ruff check .", "ruff format --check ."] }
format = { composite = ["ruff format .", "ruff check --fix ."] }
schema = "python manage.py spectacular --validate --fail-on-warn --file /tmp/opencode/nextrouter-schema.yaml"

[tool.pdm]
distribution = false

[tool.ruff]
line-length = 120
extend-exclude = ['migrations', '__init__.py', 'manage.py']

[tool.ruff.lint]
preview = true
select = [
    "F",     
    "E", "W",
    "I",  
    "UP", 
    "B",  
    "C4", 
    "DJ", 
    "SIM",
    "RUF",    
]
ignore = [
    "no-self-use"
]

[tool.ruff.format]
preview = true
quote-style = 'single'
