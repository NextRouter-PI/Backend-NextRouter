[project]
name = "nextrouter"
version = "1.0.0"
description = ""
requires-python = ">=3.13"
authors = [
  { name = "Marco André Mendes", email = "marcoandre@gmail.com" },
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
  { name = "Paulo Artur Pereira", email = "pauloartur23@gmail.com" },
]
dependencies = [
  "dj-database-url>=3.1.2",
  "django-cloudinary-storage>=0.3.0",
  "django-cors-headers>=4.9.0",
  "django-extensions>=4.1",
  "django-filter>=26.2",
  "django>=6.0.7",
  "djangorestframework>=3.17.1",
  "drf-spectacular>=0.30.0",
  "gunicorn>=26.0.0",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.2.2",
  "python-magic-bin>=0.4.14; sys_platform == \"win32\"",
  "python-magic>=0.4.27; sys_platform == \"linux\"",
  "uvicorn>=0.51.0",
  "whitenoise[brotli]>=6.12.0",
  "djangorestframework-simplejwt>=5.5.1",
  "pyparsing>=3.3.2",
  "pillow>=12.3.0",
  "django-crispy-forms>=2.7",
  "channels>=4.3.2",
  "daphne>=4.2.3",
  "requests>=2.34.2",
  "channels-redis>=4.3.0",
  "user-agents>=2.2.0",
  "django-ipware>=8.0.0",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "django-stubs>=6.1.0",
]

[tool.pdm.scripts]
# Desenvolvimento: somente o backend; LAN exige o IPv4 explícito da máquina.
dev = "python -m scripts.dev"
dev-lan = "python -m scripts.dev --lan-host"
worker = "python manage.py process_route_jobs --settings=app.settings.dev"
simulate-trip = "python -m scripts.trip_simulator"

# Administração local: operações manuais, nunca chamadas pelo startup.
createsuperuser = "python manage.py createsuperuser --settings=app.settings.dev"
migrate = "python manage.py migrate --settings=app.settings.dev"
shell = "python manage.py shell --settings=app.settings.dev"
shellp = "python manage.py shell_plus --settings=app.settings.dev"

# Validações opt-in. Testes não carregam .env; regressão de migrations é separada.
test = "python manage.py test --noinput --settings=tests.settings --exclude-tag=migration"
test-migrations = "python manage.py test --noinput --settings=tests.settings --tag=migration"
test-html = "node --test tests/html_client.test.mjs"
check = { composite = ["python manage.py check --settings=app.settings.dev", "python manage.py makemigrations --check --dry-run --settings=app.settings.dev"] }
lint = { composite = ["ruff check .", "ruff format --check ."] }
format = { composite = ["ruff format .", "ruff check --fix ."] }
schema = "python manage.py spectacular --settings=app.settings.dev --validate --fail-on-warn --file /tmp/opencode/nextrouter-schema.yaml"

# Produção/entrega identificada: configuração explícita, fora da rotina local.
prod-web = "python -m scripts.runtime web"
prod-worker = "python -m scripts.runtime worker"
release-check = "python -m scripts.runtime release"
check-deploy = "python manage.py check --deploy --settings=app.settings.prod"
prepare-frontend = "python -m scripts.frontend_artifact prepare"
verify-frontend = "python -m scripts.frontend_artifact verify"

[tool.pdm]
distribution = false

[tool.ruff]
line-length = 120
extend-exclude = ['migrations', '__init__.py', 'manage.py']

[tool.ruff.lint]
preview = true
select = [
    "F",     
    "E", "W",
    "I",  
    "UP", 
    "B",  
    "C4", 
    "DJ", 
    "SIM",
    "RUF",    
]
ignore = [
    "no-self-use"
]

[tool.ruff.format]
preview = true
quote-style = 'single'
