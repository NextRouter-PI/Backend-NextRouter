[project]
name = "nextrouter"
version = "1.0.0"
description = ""
authors = [
  { name = "Marco André Mendes", email = "marcoandre@gmail.com" },
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
  { name = "Paulo Artur Pereira", email = "pauloartur23@gmail.com" },
]
dependencies = [
  "dj-database-url>=3.1.2",
  "django-cloudinary-storage>=0.3.0",
  "django-cors-headers>=4.9.0",
  "django-extensions>=4.1",
  "django-filter>=26.1",
  "django>=6.0.7",
  "djangorestframework>=3.17.1",
  "drf-spectacular>=0.30.0",
  "gunicorn>=26.0.0",
  # 'mysqlclient>=2.2.4',
  "psycopg2-binary>=2.9.12",
  "python-dotenv>=1.2.2",
  "python-magic-bin>=0.4.14; sys_platform == \"win32\"",
  "python-magic>=0.4.27; sys_platform == \"linux\"",
  "setuptools>=83.0.0",
  "uvicorn>=0.51.0",
  "whitenoise[brotli]>=6.12.0",
  "djangorestframework-simplejwt>=5.5.1",
  "pyparsing>=3.3.2",
  "pydot>=4.0.1",
  "pillow>=12.3.0",
]

license = { text = "MIT" }

[dependency-groups]
dev = ["pylint>=4.0.6", "ipython>=9.15.0", "ruff>=0.15.21"]

[tool.pdm.scripts]
pre_dev = { composite = [
  "python ./scripts/setup_env.py",
  "python ./scripts/set_my_ip.py",
] }
dev = "python manage.py runserver 0.0.0.0:19003"
createsuperuser = "python manage.py createsuperuser"
pre_migrate = "python manage.py makemigrations"
migrate = "python manage.py migrate"
post_migrate = "python manage.py graph_models --pydot --arrow-shape normal --color-code-deletions --hide-edge-labels --disable-sort-fields -S -g -o core.png authenticator uploader router"
shell = "python manage.py shell"
shellp = "python manage.py shell_plus"
test = "python manage.py test"
loaddata = "python manage.py loaddata core.json"
dumpdata = "python manage.py dumpdata --indent 2"
cria_api = "python ./scripts/cria_api.py {args}"
check = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"

[tool.pdm]
distribution = false

[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = "true"

[tool.ruff]
line-length = 120
extend-exclude = ['migrations', '__init__.py', 'manage.py']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ["PLR6301"]

[tool.ruff.format]
preview = true
quote-style = 'single'
