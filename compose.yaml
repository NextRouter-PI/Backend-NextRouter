# Ambiente de referência local/homologação. Não é autorização para migrar banco existente.
x-app: &app
  image: nextrouter:${BACKEND_REVISION:?defina revisão completa do backend}
  build:
    context: .
    target: release
    args:
      BACKEND_REVISION: ${BACKEND_REVISION:?defina revisão completa do backend}
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.11-slim-bookworm}
  init: true
  restart: unless-stopped
  environment: &app_environment
    DJANGO_SETTINGS_MODULE: app.settings.prod
    BACKEND_REVISION: ${BACKEND_REVISION:?defina revisão completa do backend}
    SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?defina origem HTTPS única}
    TRUST_PROXY_HEADERS: "true"
    HSTS_SECONDS: ${HSTS_SECONDS:-0}
    HSTS_INCLUDE_SUBDOMAINS: "false"
    HSTS_PRELOAD: "false"
    DATABASE_URL: ${DATABASE_URL:?defina PostgreSQL deste ambiente}
    REDIS_URL: redis://redis:6379/0
    PRIVATE_DOCUMENT_ROOT: /srv/private-documents
    OSRM_URL: ${OSRM_URL:?defina serviço de rotas autorizado}
    GEOCODING_URL: ${GEOCODING_URL:?defina geocodificação autorizada}
    EMAIL_HOST: ${EMAIL_HOST:?defina EMAIL_HOST}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:?defina EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?defina EMAIL_HOST_PASSWORD}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?defina remetente}
    CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    PORT: "8000"
  volumes:
    - media:/srv/app/media
    - private_documents:/srv/private-documents
  networks: [backend, edge]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  web:
    <<: *app
    command: [python, -m, scripts.runtime, web]

  worker:
    <<: *app
    profiles: [worker]
    command: [python, -m, scripts.runtime, worker]
    healthcheck: {disable: true}
    stop_grace_period: 60s
    environment:
      <<: *app_environment
      # Vazio não é default operacional: o launcher recusa iniciar sem cada valor.
      # Isso permite instalar a API antes de existir uma empresa aprovada.
      WORKER_COMPANY_ID: ${WORKER_COMPANY_ID:-}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-}
      WORKER_RETRY_SECONDS: ${WORKER_RETRY_SECONDS:-}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-}
      WORKER_SCHEDULE_BATCH_SIZE: ${WORKER_SCHEDULE_BATCH_SIZE:-}
      WORKER_MAINTENANCE_BATCH_SIZE: ${WORKER_MAINTENANCE_BATCH_SIZE:-}
      WORKER_JOB_BATCH_SIZE: ${WORKER_JOB_BATCH_SIZE:-}

  proxy:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports: ["127.0.0.1:${HTTPS_PORT:?defina porta HTTPS local}:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:?defina pasta de certificado e chave fora do Git}:/etc/nginx/tls:ro
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend: {internal: true}
  edge: {}
volumes:
  postgres_data:
  media:
  private_documents:
