services:
  web:
    build: .
    environment: &app_environment
      DJANGO_SETTINGS_MODULE: app.settings.prod
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      PRIVATE_DOCUMENT_ROOT: /srv/app/private-documents
      OSRM_URL: ${OSRM_URL:?defina OSRM_URL}
      GEOCODING_URL: ${GEOCODING_URL:?defina GEOCODING_URL}
      EMAIL_HOST: ${EMAIL_HOST:?defina EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?defina EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?defina EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?defina DEFAULT_FROM_EMAIL}
    command: sh -c "python manage.py collectstatic --noinput && exec daphne -b 0.0.0.0 -p 8000 app.asgi:application"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/srv/app/media
      - private_documents:/srv/app/private-documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    environment: *app_environment
    command: python manage.py process_route_jobs
    volumes:
      - media:/srv/app/media
      - private_documents:/srv/app/private-documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
  media:
  private_documents:
