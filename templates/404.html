<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <title>404 — Página não encontrada | NextRouter</title>
  <style>
    :root {
      --primary: #ec8314;
      --primary-hover: #d4710c;
      --primary-soft: rgba(236, 131, 20, 0.12);
      --on-primary: #ffffff;
      --bg: #fafafa;
      --altbg: #f0eeea;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #1c1917;
      --text-muted: #71717a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --bg: #111113;
        --altbg: #18181b;
        --surface: #1c1c1e;
        --border: #2e2e32;
        --text: #f3f3f5;
        --text-muted: #a1a1aa;
        --primary-soft: rgba(236, 131, 20, 0.16);
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    html.dark {
      --bg: #111113;
      --altbg: #18181b;
      --surface: #1c1c1e;
      --border: #2e2e32;
      --text: #f3f3f5;
      --text-muted: #a1a1aa;
      --primary-soft: rgba(236, 131, 20, 0.16);
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .status-page {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }

    .brand-accent {
      color: var(--primary);
    }

    .status-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      margin-bottom: 16px;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }

    .status-code {
      margin: 0 0 6px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--primary);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .status-desc {
      margin: 0 0 24px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .btn-primary,
    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    }

    .btn-primary svg,
    .btn-outline svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border: 1px solid var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--altbg);
    }

    .btn-primary:active,
    .btn-outline:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.className = 'dark';
        else if (theme === 'light') document.documentElement.className = 'light';
      } catch (e) {}
    })();
  </script>

  <main class="status-page">
    <a href="/" class="brand-mark" aria-label="NextRouter">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 20c-4.42 0-8-1.34-8-3 0-1.08 1.54-2.03 3.85-2.56l.68 1.36C6.95 16.17 5.8 16.69 5.8 17c0 .77 2.55 1.7 6.2 1.7s6.2-.93 6.2-1.7c0-.31-1.15-.83-2.73-1.2l.68-1.36C18.46 14.97 20 15.92 20 17c0 1.66-3.58 3-8 3z"/>
        <path d="M12 2C8.69 2 6 4.69 6 8c0 4.5 6 9.5 6 9.5s6-5 6-9.5c0-3.31-2.69-6-6-6zm0 8.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"/>
      </svg>
      <span><span class="brand-accent">NEXT</span>ROUTER</span>
    </a>

    <section class="status-card" aria-labelledby="not-found-title">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-5.7-7-11a7 7 0 1 1 14 0c0 5.3-7 11-7 11z"/>
          <path d="M9.8 9.2a2.3 2.3 0 0 1 4.4.8c0 1.4-2.2 1.8-2.2 3"/>
          <circle cx="12" cy="16" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      <p class="status-code">404</p>
      <h1 id="not-found-title">Página não encontrada</h1>
      <p class="status-desc">
        O endereço acessado não existe ou foi movido. Verifique a URL ou retorne à tela principal.
      </p>

      <div class="status-actions">
        <a href="/" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5 9.5V20h14V9.5"/>
          </svg>
          Voltar ao início
        </a>
        <button type="button" class="btn-outline" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"/>
            <path d="m12 19-7-7 7-7"/>
          </svg>
          Voltar
        </button>
      </div>
    </section>
  </main>
</body>
</html>
