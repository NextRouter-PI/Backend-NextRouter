# Exemplo de UMA borda TLS controlada. Certificados privados não entram na imagem/Git.
events {}
http {
    server_tokens off;
    log_format operational '{"status":$status,"duration":$request_time,"bytes":$bytes_sent}';
    access_log /dev/stdout operational;
    # Evita que logs de erro padrão incluam URI/query/headers privados.
    error_log /dev/null;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 12m;
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header Forwarded "";
            proxy_set_header Daphne-Root-Path "";
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
